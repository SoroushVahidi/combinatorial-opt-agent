name: NLP4LP downstream benchmark (authenticated)

# Research execution is manual, explicit, and separate from maintenance CI.
on:
  workflow_dispatch:
    inputs:
      confirm_research_run:
        description: "Run historical research with approved dataset access; do not publish raw records"
        type: boolean
        required: true
        default: false

jobs:
  run-downstream-benchmark:
    if: ${{ inputs.confirm_research_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 240      # generous safety budget; measured runtime: ~3 min (32 s benchmark + pip install)
    permissions:
      contents: read           # no repository writes

    env:
      PYTHONUNBUFFERED: "1"
      HF_DATASETS_DISABLE_PROGRESS_BARS: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"

    steps:
      # ------------------------------------------------------------------ setup
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------ preflight
      - name: Check HF_TOKEN presence
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "HF_TOKEN: present"
          else
            echo "HF_TOKEN: NOT SET — add HF_TOKEN as a repository secret (Settings → Secrets → Actions)"
          fi

      - name: Verify HF token and dataset access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python training/external/verify_hf_access.py

      # ------------------------------------------------------------------ benchmark
      - name: Build NLP4LP eval sets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python training/external/build_nlp4lp_benchmark.py \
            --variants orig,noisy,short

      - name: Run full downstream benchmark (all methods × all variants)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NLP4LP_GOLD_CACHE: results/eswa_revision/00_env/nlp4lp_gold_cache.json
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python training/external/run_full_downstream_benchmark.py \
            2>&1 | tee /tmp/benchmark_stdout.log
          echo "Exit code: $?"

      # Raw logs, gated source records and generated datasets are not uploaded.
      # Review outputs on authorized infrastructure before any separate publication.
      - name: Print result summary
        if: always()
        run: |
          echo "=== Experiment results (orig variant) ==="
          if [ -f results/eswa_revision/14_reports/postfix_main_metrics.md ]; then
            cat results/eswa_revision/14_reports/postfix_main_metrics.md
          else
            echo "Report not found — check benchmark log above."
          fi
          echo ""
          echo "=== postfix_main_metrics.csv ==="
          if [ -f results/eswa_revision/13_tables/postfix_main_metrics.csv ]; then
            cat results/eswa_revision/13_tables/postfix_main_metrics.csv
          fi
