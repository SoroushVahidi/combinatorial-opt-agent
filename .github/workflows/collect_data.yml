name: Collect Optimization Data

on:
  workflow_dispatch:
    inputs:
      confirm_research_run:
        description: "Acquire upstream data only after reviewing access and redistribution terms"
        type: boolean
        required: true
        default: false

jobs:
  collect:
    if: ${{ inputs.confirm_research_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collection pipeline
        run: |
          python pipeline/run_collection.py \
            --sources nl4opt gurobi_optimods gurobi_examples

      # No automatic upload of processed third-party data. Use authorized local
      # infrastructure when retaining raw outputs is necessary; review rights first.
